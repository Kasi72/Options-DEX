[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty-signal-engine"
version = "0.1.0"
description = "Precision-first NIFTY and BANKNIFTY options research engine."
readme = "README.md"
requires-python = ">=3.12,<3.15"

[project.optional-dependencies]
dev = [
    "hypothesis>=6.0",
    "mypy>=1.0",
    "pytest>=8.0",
    "ruff>=0.0",
]

[project.scripts]
nifty-signal = "nifty_signal_engine.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
exclude = ["reference"]

[tool.mypy]
python_version = "3.12"
